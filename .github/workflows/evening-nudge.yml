name: Evening Spell Check nudge

on:
  schedule:
    # 02:00 UTC = 7:00pm Pacific Daylight Time (the previous calendar day in
    # Pacific, which is what notify.js uses for the day number). The whole
    # challenge (Sep 18 - Oct 18) falls before the November switch back to
    # Standard Time, so this offset holds for the entire run.
    - cron: '0 2 * * *'
  workflow_dispatch: {}   # lets you trigger a test run by hand from the Actions tab

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - run: node notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_MODE: nudge
