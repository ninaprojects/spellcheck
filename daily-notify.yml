name: Daily Spell Check notification

on:
  schedule:
    # 15:00 UTC = 8:00am Pacific Daylight Time. This whole challenge
    # (Sep 18 - Oct 18) falls before Pacific switches back to Standard
    # Time in November, so this offset holds for the entire run.
    - cron: '0 15 * * *'
  workflow_dispatch: {}   # lets you trigger a test run by hand from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - run: node notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
