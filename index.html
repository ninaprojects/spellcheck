}

function counts(h,k){return !!h.days[wd(k)];}
function pausedOn(h,k){return h.paused&&h.pausedAt&&k>=h.pausedAt;}
function weekCount(p,h,wk){let n=0;for(let i=0;i<7;i++){const k=addDays(wk,i);if(k<=todayK()&&isDone(p,h,k))n++;}return n;}
function weeklyStreak(p,h,upTo){
  const cw=weekStart(upTo||todayK());const first=weekStart(h.createdDay||todayK());
  let wk=cw,n=0,g=0;
  if(!upTo&&pausedOn(h,todayK())&&h.pausedAt)wk=addDays(weekStart(h.pausedAt),-7);
  while(g++<200&&wk>=first){
    if(weekCount(p,h,wk)>=h.perWeek)n++;
    else if(wk!==cw)break;
    wk=addDays(wk,-7);
  }
  return n;
}
function weeklyBest(p,h){
  let best=0,cur=0,wk=weekStart(h.createdDay||todayK());const cw=weekStart(todayK());
  while(wk<=cw){if(weekCount(p,h,wk)>=h.perWeek){cur++;best=Math.max(best,cur);}else if(wk!==cw)cur=0;wk=addDays(wk,7);}
  return best;
}
function streak(p,h){
  if(h.perWeek)return weeklyStreak(p,h);
  let k=todayK(),n=0;
  if(pausedOn(h,k)){k=addDays(h.pausedAt,-1);}
  let guard=0;
  while(guard++<800){
    if(h.created&&k<h.createdDay)break;
    if(!counts(h,k)){k=addDays(k,-1);continue;}
    if(isDone(p,h,k)){n++;}
    else if(k!==todayK()&&!(pausedOn(h,k)))break;
    else if(k===todayK()){/* today not done yet, not a miss */}
    k=addDays(k,-1);
  }
  return n;
}
function bestStreak(p,h){
  if(h.perWeek)return weeklyBest(p,h);
  let best=0,cur=0;let k=h.createdDay||todayK();const end=todayK();
  while(k<=end){

  const v=votesFor(wk);const t={};Object.values(v).forEach(o=>t[o]=(t[o]||0)+1);
  const ids=Object.keys(t);if(!ids.length)return null;
  const max=Math.max(...ids.map(i=>t[i]));const tied=ids.filter(i=>t[i]===max).sort();
  return tied[hash(wk)%tied.length]; // random tie break, stable per week
}
function covenHabitFor(wk){ // the habit running this week = winner of last week's vote, else the previous habit, else the first option
  return winnerFor(wk)||(wk>weekStart(SEASON_START)?covenHabitFor(addDays(wk,-7)):'phone');
}
const _bq={used:new Set(),at:-1,map:{}};
function brewPick(i,k){ // walks the days from the start so a question is never used twice. Same result for everyone.
  if(_bq.map[i]!==undefined)return _bq.map[i];
  for(let d=_bq.at+1;d<=i;d++){
    const dk=addDays(SEASON_START,d);const sea=brewSeason(dk);
    const pref=(sea&&d%2===1)?Q_SEASON[sea]:Q_PHASE[moonPhaseName(dk)];
    const fit=[].concat(Q_PHASE[moonPhaseName(dk)]||[],sea?Q_SEASON[sea]:[]); // only questions that fit this day's sky
    const q=[].concat(pref||[],fit).find(x=>!_bq.used.has(x))||null;
    if(q)_bq.used.add(q);_bq.map[d]=q;_bq.at=d;
  }
  return _bq.map[i];
}
function brewQ(k){
  const i=Math.round((parse(k)-parse(SEASON_START))/86400000);if(i<0)return null;
  if(BREW_PREVIEW&&SKY_Q[k])return SKY_Q[k]; // dated drafts show only in preview until approved
  if(BREW_PREVIEW&&k>='2026-11-05'&&k<='2026-11-12')return SKY_RX_Q;
  if(!(BREW_LIVE||BREW_PREVIEW))return null;
  return brewPick(i,k); // null once all questions are used, so the card hides instead of repeating
}
function brewAns(p,k){return (D.qa[p]||{})[k]||null;}
function brewRevealed(k){return !!brewAns(me,k)||k<todayK();}
function votingWeek(k){return addDays(weekStart(k),7);} // vote is for next week

function habitRow(h){
  const p=me,t=todayK();const v=val(p,h.id,t);const done=isDone(p,h,t);
  const s=streak(p,h);
  const rest=!counts(h,t);const paused=pausedOn(h,t);
  let line='';
  if(h.perWeek){const c=weekCount(p,h,weekStart(t));line=(h.type==='number'?`${v} of ${h.target} ${esc(h.unit)} today · `:'')+`${c} of ${h.perWeek} this week`+(s?` · ${s} week${s===1?'':'s'} in a row`:'');}
  else if(h.type==='number')line=`${v} of ${h.target} ${esc(h.unit)} today`+(s?` · ${s} day${s===1?'':'s'} in a row`:'');
  else line=s?`${s} day${s===1?'':'s'} in a row`:'Not started yet';
  const tag=h.shared?'<span>Shared with the coven</span>':'';
  let ctl='';
  if(paused)ctl=`<span class="done" style="color:var(--sec)">Paused</span>`;
  else if(rest)ctl=`<span class="done" style="color:var(--sec)">Rest day</span>`;
  else if(h.type==='number'){

}

const ALLDONE=['All done. Your glow is visible from space.','Every habit done. Somebody get this person a trophy and a snack.','All done and looking cute doing it.','Clean sweep. Hydrate, you iconic thing.'];

function todayProgress(){const t=todayK();const l=myHabits(me).filter(h=>counts(h,t)&&!pausedOn(h,t));return {n:l.length,d:l.filter(h=>isDone(me,h,t)).length};}
function brewCard(t){
  const q=brewQ(t);if(!q)return '';
  const ans=PEOPLE.filter(p=>brewAns(p,t));const mine=brewAns(me,t);
  const others=ans.filter(p=>p!==me);
  const wait=!mine&&others.length?`${ans.length} of 4 answered. ${list(others)} already answered. No spoilers until you do.`:`${ans.length} of 4 answered`;
  const con=`<div class="con" role="img" aria-label="${wait}">`+PEOPLE.map((p,i)=>`${i?`<span class="ln${brewAns(PEOPLE[i-1],t)&&brewAns(p,t)?' on':''}"></span>`:''}<span class="n${brewAns(p,t)?' on':''}${ui.starPop===p+t?' pop':''}">${initial(p)}</span>`).join('')+`</div>`;
  let body;
  if(ui.brewOpen){body=`<div class="field"><label for="bi" style="color:#CBBFE6">Your answer, 140 characters</label><input id="bi" type="text" maxlength="140" value="${esc(mine?mine.t:'')}" data-in="brew" autocomplete="off"></div><div style="display:flex;gap:16px;align-items:center"><button class="pill" data-act="brewsave" style="width:auto;padding:0 24px">Save</button><button class="link" data-act="brewclose" style="color:#CBBFE6;text-decoration-color:#CBBFE6">Cancel</button></div>`;}
  else if(mine){body=`<div style="font-size:16px;line-height:1.4">${esc(mine.t)}</div><div class="row">${con}<button class="link" data-act="brewopen" style="color:#fff;text-decoration-color:#FFC94F">Edit</button></div>`;}
  else body=`<div class="row">${con}<button class="pill" data-act="brewopen" style="width:auto;padding:0 22px;min-height:44px;white-space:nowrap">Spill it</button></div>`;
  const m=moonSvg(t);
  return `<div class="card brewcard"><div class="brewmoon" style="opacity:${(.35+.65*m.ill).toFixed(2)};box-shadow:0 0 30px 8px rgba(255,201,79,${(.28*m.ill).toFixed(2)})">${m.svg}</div>${BREW_STARS}<div class="label">Today's brew</div><div class="skytag">${esc(skyTag(t))}</div><div style="font-family:'Noto Serif Display',Georgia,serif;font-weight:600;font-size:23px;line-height:1.22;margin-right:50px">${esc(q)}</div>${body}</div>`;
}
function skyLine(phase){return phase==='New Moon'?'A fresh start is on the table.':phase==='Full Moon'?'Things are bright and a little loud.':'The moon is doing its thing. So are we.';}
function list(a){return a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function anyShared(p,k){ // "showed up" counts shared habits, the coven habit, or the spell. Private habits never leak.
  const l=(D.log[p]||{})[k]||{};
  for(const id in l){if(!l[id])continue;if(id.startsWith('_'))return true;const f=findHabit(id);if(f&&f.p===p&&f.h.shared&&isDone(p,f.h,k))return true;}
  return false;
}

function buildFeed(){
  const items=[];const t=todayK();
  const wk=weekStart(t);
  // vote result for this week
  const pw=wk;const w=winnerFor(pw);
  if(w)items.push({id:'vote:'+wk,at:wk+'a',who:'The coven',text:` has spoken. This week is ${optName(w)}.`});
  else if(Object.keys(votesFor(pw)).length===0&&wk>weekStart(SEASON_START)&&!w)items.push({id:'novote:'+wk,at:wk+'a',who:'The coven',text:` Nobody voted, so we are running it back. This week is ${optName(covenHabitFor(wk))} again.`});
  for(const p of PEOPLE){
    const logs=D.log[p]||{};
    for(const k of Object.keys(logs).sort().slice(-14)){
      for(const id of Object.keys(logs[k]||{})){
        if(!logs[k][id])continue;
        if(id.startsWith('_spell_')){const ev=weekEvent(k);if(ev)items.push({id:'sp:'+p+k,at:k+'m',who:p,text:fill(pick(L_MOON,p+k),{name:'\u0001',event:ev.name})});continue;}
        if(id.startsWith('_'))continue;
        const f=findHabit(id);if(!f||f.p!==p||!f.h.shared)continue;
        const h=f.h;if(!isDone(p,h,k))continue;
        // streak as of day k
        const n=streakAt(p,h,k);if(!n&&!h.perWeek)continue;
        const pre=presetOf(h);let text,bonus='';
        if(!h.perWeek&&[7,14,30].includes(n)){text=fill(pick(L_MILE[n],p+id+n),{name:'\u0001',habit:h.name,n});bonus=pre&&BONUS[pre.id]?pick(BONUS[pre.id][n],id+n):'';}
        else if(h.perWeek)text=`\u0001 finished ${h.name}. ${weekCount(p,h,weekStart(k))} of ${h.perWeek} this week.`;
        else text=fill(pick(L_FINISH,p+id+k),{name:'\u0001',habit:h.name,n});
        items.push({id:'f:'+p+':'+id+':'+k,at:k+'z',who:p,text:text,bonus});
      }
    }
    for(const h of myHabits(p)){if(h.groupOwner&&h.groupOwner===p&&h.groupId===h.id&&h.shared)items.push({id:'g:'+h.id,at:(h.createdDay||t)+'g',who:p,text:fill(pick(L_GROUP,h.id),{name:'\u0001',habit:h.name}),join:h});}
  }
  for(let i=0;i<7;i++){
    const k=addDays(t,-i);const q=brewQ(k);if(!q)continue;
    const ans=PEOPLE.filter(p=>brewAns(p,k));if(!ans.length)continue;
    let body;
    if(brewRevealed(k))body=`<div class="label" style="margin-bottom:4px">Brew${k===t?', today':', '+longDate(k)}</div><div style="font-weight:600;margin-bottom:6px">${esc(q)}</div>`+ans.map(p=>`<div style="margin-top:4px"><b>${esc(p)}</b> ${esc(brewAns(p,k).t)}</div>`).join('');
    else body=ans.map(p=>`<div style="margin-top:4px">${esc(fill(BREW_LINE,{name:p}))}</div>`).join('');
    items.push({id:'qa:'+k,at:k+'q',who:'',body});
  }
  items.sort((a,b)=>b.at<a.at?-1:1);
  return items.slice(0,25);
}
function streakAt(p,h,k){
  if(h.perWeek){return weekCount(p,h,weekStart(k))===h.perWeek&&isDone(p,h,k)?weeklyStreak(p,h,k):0;}
  let n=0,x=k,g=0;
  while(g++<800){
    if(h.createdDay&&x<h.createdDay)break;
    if(!counts(h,x)){x=addDays(x,-1);continue;}
    if(isDone(p,h,x))n++;else break;
    x=addDays(x,-1);
  }
  return n;
}

function pointsFor(p,from,to){
  let pts=0,days=0;
  let k=from;while(k<=to){
    let day=false;const l=(D.log[p]||{})[k]||{};
    for(const id in l){if(!l[id])continue;if(id.startsWith('_')){pts++;day=true;continue;}const f=findHabit(id);if(f&&f.p===p&&f.h.shared&&isDone(p,f.h,k)){pts++;day=true;}}
    if(day)days++;k=addDays(k,1);
  }
  return {pts:pts*10,days};
}

  if(s===3){const st=notifState();main=`<div class="h1">Never miss a day.</div><div class="sec">Turn on notifications to get a nudge when a habit is waiting, and news from the coven. Your current Spell Check keeps sending its usual ones too.</div>${st==='ios'?`<div class="card"><div class="label">On iPhone, do this first</div><div style="font-size:14px;line-height:1.6">1. Tap Share in Safari.<br>2. Choose Add to Home Screen.<br>3. Open Spell Check from your Home Screen.</div></div>`:st==='on'?`<div class="card"><div class="h2">Notifications are on.</div></div>`:st==='blocked'?`<div class="small">Notifications are blocked for this site. You can allow them in your phone or browser settings.</div>`:''}${ui.notifMsg?`<div class="small" style="color:var(--text)">${esc(ui.notifMsg)}</div>`:''}`;btns=(st==='ask'?`<button class="pill" data-act="notifon">Turn on notifications</button><button class="link quiet" data-act="snext">Not now</button>`:`<button class="pill" data-act="snext">Next</button>`);}
  if(s===4){main=`<div class="h1">One last thing.</div><div class="sec">Pick a habit to start with. You can add more any time.</div>`;btns=`<a class="pill" href="#add" data-act="sdone">Add your first habit</a><a class="link quiet" href="#today" data-act="sdone">Skip, take me to Today</a>`;}
  return `<div class="top"><div class="brand">Spell Check</div><div class="small">Step ${s} of 4</div></div><div style="display:flex;gap:6px;padding:0 20px">${bars}</div><div class="center">${main}</div><div style="padding:0 28px 34px;display:flex;flex-direction:column;gap:10px">${btns}</div>`;
}

function viewSetupGateWrap(){return viewSetup();}

/* ---------- router ---------- */
function route(){
  const h=(location.hash||'#today').slice(1);const [r,a]=h.split('/');
  const prev=ui.route;ui.route=r||'today';ui.arg=a||null;
  if(prev!==ui.route){ui.confirm=false;if(ui.route!=='add'&&ui.route!=='edit'&&ui.route!=='setup')ui.draft=null;if(ui.route==='edit'&&ui.draft&&ui.draft._id!==a)ui.draft=null;}
  ui.enter=prev!==ui.route;render();window.scrollTo(0,0);
}
function render(){
  const act=document.activeElement;const keep=act&&act.dataset&&act.dataset.in?{id:act.id,s:act.selectionStart}:null;
  let html;
  if(!me)html=viewGate();
  else{
    const needSetup=!(D.prof[me]||{}).setup&&loaded&&ui.route!=='setup'&&!ui.skipSetup;
    if(needSetup&&(ui.route==='today')){ui.route='setup';}
    switch(ui.route){
      case 'setup':html=viewSetup();break;
      case 'add':html=viewAdd();break;
      case 'habit':html=viewDetail(ui.arg);break;
      case 'edit':html=viewEdit(ui.arg);break;
      case 'sky':html=viewSky();break;
      case 'coven':html=viewCoven();break;
      case 'standings':html=viewStandings();break;
      case 'journey':html=viewJourney();break;
      case 'me':html=viewMe();break;
      case 'connections':html=viewConnections();break;
      default:html=viewToday();
    }
  }
  $app.innerHTML=html;$app.classList.toggle('enter',!!ui.enter);ui.enter=false;
  if(keep&&keep.id){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.s);}catch(e){}}}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){location.hash='#'+go.dataset.go;return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  const t=todayK();
  switch(a){
    case 'who':me=b.dataset.p;try{localStorage.setItem('h3-whoami',me);}catch(x){}startSyncOnce();ui.route='today';render();return;
    case 'switch':try{localStorage.removeItem('h3-whoami');}catch(x){}me=null;render();return;
    case 'tog':{const f=findHabit(id);if(!f)return;ui.popId=id;setTimeout(()=>{ui.popId=null;},700);const w=todayProgress();setVal(id,t,isDone(me,f.h,t)?0:1);const n=todayProgress();if(n.n&&n.d===n.n&&!(w.n&&w.d===w.n)){ui.burst=Date.now();haptic('done');}break;}
    case 'add':{const f=findHabit(id);const w=todayProgress();setVal(id,t,Math.min(f.h.target,val(me,id,t)+f.h.step));const n=todayProgress();if(n.n&&n.d===n.n&&!(w.n&&w.d===w.n)){ui.burst=Date.now();haptic('done');}break;}
    case 'notifon':enableNotifs(false);return;
    case 'b3edit':ui.b3edit=!ui.b3edit;break;
    case 'birthedit':ui.birthOpen=!ui.birthOpen;break;
    case 'sub':{const f=findHabit(id);setVal(id,t,Math.max(0,val(me,id,t)-f.h.step));break;}
    case 'cov':setVal(id,t,val(me,id,t)>=1?0:1);break;
    case 'preset':{const p=ALLP.find(x=>x.id===id);const d=ui.draft;d.preset=id;d.name=p.full;d.type=p.type;if(p.target){d.target=p.target;d.unit=p.unit;d.step=p.step;d.stepTouched=true;}else{d.target=1;}break;}
    case 'dtype':ui.draft.type=b.dataset.v;if(b.dataset.v==='number'&&ui.draft.target<2){ui.draft.target=100;ui.draft.unit='reps';ui.draft.step=10;}break;
    case 'brewopen':ui.brewOpen=true;haptic('tap');break;
    case 'brewclose':ui.brewOpen=false;break;
    case 'brewsave':{const el=document.getElementById('bi');const v=(el?el.value:'').replace(/\s+/g,' ').trim().slice(0,140);if(v){(D.qa[me]||(D.qa[me]={}))[t]={t:v,at:Date.now()};save('qa');haptic('done');ui.starPop=me+t;setTimeout(()=>{ui.starPop=null;},900);}ui.brewOpen=false;break;}
    case 'dfreq':ui.draft.freq=b.dataset.v;break;
    case 'dweekup':ui.draft.perWeek=Math.min(7,(+ui.draft.perWeek||1)+1);break;
    case 'dweekdn':ui.draft.perWeek=Math.max(1,(+ui.draft.perWeek||1)-1);break;
    case 'eweekup':ui.draft.perWeek=Math.min(7,(+ui.draft.perWeek||1)+1);break;
    case 'eweekdn':ui.draft.perWeek=Math.max(1,(+ui.draft.perWeek||1)-1);break;
    case 'dday':{const d=ui.draft;d.days[+b.dataset.i]=d.days[+b.dataset.i]?0:1;break;}
    case 'dshare':ui.draft.shared=b.dataset.v==='1';break;
    case 'stepedit':ui.stepEdit=!ui.stepEdit;break;
    case 'closeadd':ui.draft=null;break;
    case 'startgroup':ui.draft={name:'',type:'yesno',target:100,unit:'reps',step:10,stepTouched:false,shared:true,preset:null,days:[1,1,1,1,1,1,1],freq:'days',perWeek:3,group:true};break;
    case 'create':{
      const d=ui.draft;if(!d.name.trim())return;
      const o={name:d.name.trim(),type:d.type,days:d.freq==='week'?[1,1,1,1,1,1,1]:d.days.slice(),shared:d.shared,preset:d.preset||null};
      if(d.freq==='week')o.perWeek=Math.max(1,Math.min(7,+d.perWeek||1));
      if(d.type==='number'){o.target=Math.max(1,+d.target||1);o.unit=d.unit||'';o.step=Math.max(1,+d.step||1);}
      let h;if(d.group){o.shared=true;}
      h=newHabit(o);if(d.group){h.groupId=h.id;h.groupOwner=me;save('habits');}
      ui.draft=null;location.hash='#today';return;}
    case 'hshare':{const f=findHabit(id);f.h.shared=b.dataset.v==='1';save('habits');break;}
    case 'pause':{const f=findHabit(id);f.h.paused=!f.h.paused;f.h.pausedAt=f.h.paused?t:null;save('habits');break;}
    case 'saveedit':{const f=findHabit(id);const d=ui.draft;f.h.name=(d.name||f.h.name).trim();if(f.h.type==='number'){f.h.target=Math.max(1,+d.target||f.h.target);f.h.step=d.step;}if(f.h.perWeek)f.h.perWeek=Math.max(1,Math.min(7,+d.perWeek||f.h.perWeek));else f.h.days=d.days.slice();save('habits');ui.draft=null;location.hash='#habit/'+id;return;}
    case 'cancel':ui.draft=null;break;
    case 'stepdn':case 'stepup':{const st=[1,2,5,8,10,25,50,100];let i=st.indexOf(+ui.draft.step);if(i<0)i=2;i=Math.max(0,Math.min(st.length-1,i+(a==='stepup'?1:-1)));ui.draft.step=st[i];break;}
    case 'askarch':ui.confirm=true;break;
    case 'keep':ui.confirm=false;break;
    case 'archive':{const f=findHabit(id);f.h.archived=true;save('habits');ui.confirm=false;ui.draft=null;location.hash='#today';return;}
    case 'unarch':{const f=findHabit(id);f.h.archived=false;save('habits');break;}
    case 'vote':{const wk=votingWeek(t);(D.vote[me]||(D.vote[me]={}))[wk]=id;save('vote');ui.voteOpen=false;break;}
    case 'reopen':ui.voteOpen=true;break;
    case 'rx':{const r=(D.rx[me]||(D.rx[me]={}));const o=(r[id]||(r[id]={}));o[b.dataset.k]=!o[b.dataset.k];save('rx');break;}
    case 'join':{const src=findHabit(id);if(!src)return;if(myHabits(me).some(h=>h.groupId===src.h.groupId))return;newHabit({name:src.h.name,type:src.h.type,target:src.h.target||1,unit:src.h.unit||'',step:src.h.step||1,days:src.h.days.slice(),shared:true,preset:src.h.preset||null,groupId:src.h.groupId,groupOwner:src.h.groupOwner});break;}
    case 'stand':ui.standMode=b.dataset.v;break;
    case 'skywho':ui.sky=b.dataset.p;break;
    case 'snext':ui.setupStep=Math.min(4,ui.setupStep+1);{const pr=D.prof[me]||(D.prof[me]={});if(ui.setupStep===4||true){pr.setup=true;}save('prof');}break;
    case 'sdone':{const pr=D.prof[me]||(D.prof[me]={});pr.setup=true;save('prof');break;}
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  const i=e.target.dataset&&e.target.dataset.in;if(!i)return;const v=e.target.value;
  if(i.startsWith('big-')){const pr=D.prof[me]||(D.prof[me]={});(pr.big3||(pr.big3={}))[i.slice(4)]=v;clearTimeout(window.__bt);window.__bt=setTimeout(()=>save('prof'),500);return;}
  if(i.startsWith('birth-')){const pr=D.prof[me]||(D.prof[me]={});(pr.birth||(pr.birth={}))[i.slice(6)]=v;clearTimeout(window.__bt);window.__bt=setTimeout(()=>save('prof'),500);return;}
  if(i==='sname'){const pr=D.prof[me]||(D.prof[me]={});pr.name=v;clearTimeout(window.__bt);window.__bt=setTimeout(()=>save('prof'),500);return;}
  if(i==='brew')return;
  const d=ui.draft;if(!d)return;
  d[i]=v;
  if(i==='name'&&d.preset&&ALLP.find(x=>x.id===d.preset).full!==v)d.preset=null;
  if(i==='target'&&!d.stepTouched){d.step=suggestStep(v);}
  if(i==='step')d.stepTouched=true;
  if(i==='name'){const btn=document.querySelector('[data-act=create]');if(btn)btn.disabled=!v.trim();}
});
document.addEventListener('change',async e=>{
  if(!e.target||e.target.id!=='pf'||!me)return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const d=await squareJpeg(f,512);D.photo[me]={d,at:Date.now()};save('photo');render();}catch(x){console.error(x);setSync('That photo would not load. Try another.');}
});
window.addEventListener('hashchange',route);
let synced=false;function startSyncOnce(){if(synced)return;synced=true;startSync();importFromRound2();}
function importFromRound2(){ // carry over what we can so nobody has to redo anything
  if(!me||!db)return;
  const pr0=cacheGet('prof',me)||{};
  if(pr0.setup&&pr0.big3)return;
  db.ref('recalData/r2:recal:'+me).once('value').then(s=>{
    let v=s.val();if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){v=null;}}
    const pl=v&&v.placements;
    const pr=D.prof[me]||(D.prof[me]={});
    let ch=false;
    if(pl&&!pr.big3&&(pl.sun||pl.moon||pl.rising)){pr.big3={sun:pl.sun||'',moon:pl.moon||'',rising:pl.rising||''};ch=true;}
    if(autoDetected&&!pr.setup){pr.setup=true;ch=true;}
    if(ch){save('prof');render();}
  }).catch(e=>console.error(e));
}
if(me){startSyncOnce();try{if('Notification' in window&&Notification.permission==='granted'&&localStorage.getItem('h3-notif-on:'+me)!=='1')setTimeout(()=>enableNotifs(true),1500);}catch(e){}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW',e)));}
route();
// midnight rollover and tab refocus
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
setInterval(()=>{if(!document.hidden&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();},60000);

</script>
